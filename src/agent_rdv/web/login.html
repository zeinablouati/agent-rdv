<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espace médecin — Connexion</title>
<style>
  :root { --bleu:#1d6fb8; --gris:#f4f5f7; --texte:#222; --bordure:#e0e3e8; --rouge:#b3261e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--gris); color:var(--texte); display:flex; min-height:100vh; align-items:center; justify-content:center; }
  .carte { width:360px; max-width:92vw; background:#fff; border:1px solid var(--bordure); border-radius:14px; padding:28px; }
  h1 { margin:0 0 4px; font-size:19px; font-weight:600; }
  p.sous { margin:0 0 20px; font-size:13px; color:#666; }
  label { display:block; font-size:13px; margin:14px 0 6px; }
  input { width:100%; padding:11px 14px; border:1px solid var(--bordure); border-radius:10px; font-size:14.5px; outline:none; }
  input:focus { border-color:var(--bleu); }
  button { width:100%; margin-top:22px; padding:12px; border:none; background:var(--bleu); color:#fff; border-radius:10px; font-size:15px; cursor:pointer; }
  .erreur { display:none; margin-top:16px; padding:10px 14px; background:#fbeae9; color:var(--rouge); border-radius:10px; font-size:13.5px; }
</style>
</head>
<body>
<form class="carte" method="post" action="/medecin/login">
  <h1>Espace médecin</h1>
  <p class="sous">Réservé au cabinet. Les patients n'ont pas besoin de se connecter.</p>
  <div class="erreur" id="erreur">Identifiant ou mot de passe incorrect.</div>
  <label for="utilisateur">Identifiant</label>
  <input id="utilisateur" name="utilisateur" autocomplete="username" autofocus>
  <label for="mot_de_passe">Mot de passe</label>
  <input id="mot_de_passe" name="mot_de_passe" type="password" autocomplete="current-password">
  <button type="submit">Se connecter</button>
</form>
<script>
  if (new URLSearchParams(location.search).get("erreur")) {
    document.getElementById("erreur").style.display = "block";
  }
</script>
</body>
</html>
